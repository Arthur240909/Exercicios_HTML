<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title> Exercicio 16 - Pesquisa </title>
</head>
<body>
    <h1> Pesquisa de Opinião </h1>

    <form>
        <label for="nome"> Nome Completo: </label>
        <input type="text" id="nome"><br><br>
        
        <h3> Selecione seu gênero: </h3>
        <input type="radio" id="masc" name="genero" value="masculino">
        <label for="masc"> Masculino </label><br>
        <input type="radio" id="femi" name="genero" value="feminino">
        <label for="femi"> Feminino </label><br>
        <input type="radio" id="não opi" name="genero" value="não opinar">
        <label for="não opi"> Não opinar </label><br>

        <h3> Quis são seus Hobbies? (Selecione quantos quiser)</h3>

        <input type="checkbox" id="futebol" value="futebol">
        <label for="futebol">Futebol</label><br>

        <input type="checkbox" id="ginastica" value="ginastica">
        <label for="ginastica">Ginastica</label><br>

        <input type="checkbox" id="motocross" value="motocross">
        <label for="motocross">Motocross</label><br>

        <input type="checkbox" id="IPSC" value="IPSC">
        <label for="IPSC">IPSC</label><br>
        
        <input type="checkbox" id="Caminhada/Escalada" value="Caminhada/Escalada">
        <label for="Caminhada/Escalada">Caminhada/Escalada</label><br>

        <button type="submit"> Enviar </button>
    </form>
</body>
</html>
